<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clip 04 · Workflow D</title>
<style>
  * { box-sizing:border-box; margin:0; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:#fff;
    font-family:-apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  #stage { position:absolute; inset:0; overflow:hidden; }
  #shot { position:absolute; left:0; top:0; width:1600px; transform-origin:0 0; }
  .box { position:absolute; border:4px solid #1565c0; border-radius:14px; background:rgba(21,101,192,.06); opacity:0; }
  .lbl { position:absolute; white-space:nowrap; font-size:28px; font-weight:600; color:#fff; background:#1565c0;
    padding:8px 18px; border-radius:10px; opacity:0; }
  #speed { position:absolute; right:40px; top:40px; font-size:26px; font-weight:600; color:#1565c0; background:#eaf1fb;
    padding:8px 18px; border-radius:999px; opacity:0; }
  #sub { position:absolute; left:0; right:0; bottom:58px; margin:0 auto; width:max-content; max-width:1560px; text-align:center;
    font-size:38px; line-height:1.35; font-weight:500; color:#fff; background:rgba(22,32,44,.82);
    padding:10px 26px; border-radius:12px; display:none; text-wrap:balance; }
</style>
</head>
<body>
<div id="stage">
  <img id="shot" alt="">
  <div class="box" id="bPlanner"></div><div class="lbl" id="lPlanner">Planner · plans, never runs</div>
  <div class="box" id="bRun1"></div><div class="box" id="bRun2"></div><div class="lbl" id="lRun">Runtime · smoke run, then evidence check</div>
  <div class="box" id="bWorker"></div><div class="lbl" id="lWorker">Worker · fresh context</div>
  <div class="box" id="bResult"></div><div class="lbl" id="lResult">Only the runtime ends the run</div>
  <div id="speed">Live run on the demo site · sped up</div>
  <div id="sub"></div>
</div>
<script>
  // Timeline matched to the narration in Group-self.m4a (0–24 s): word times from speech recognition.
  const END = 24.5, FAST_END = 2.0, RESULT_AT = 20.4;
  // Screenshot coordinates are those of the 1600-px-wide demo frame. Graph phase: crop starting at (40, 95), x1.5,
  // so the cards are readable and the bottom row stays above the subtitles. Results phase: whole frame, x1.2.
  const VIEW = { graph: { k: 1.5, x0: 40, y0: 95 }, result: { k: 1.2, x0: 0, y0: 0 } };
  const BOX = {
    bPlanner: [519, 109, 728, 219], bRun1: [399, 296, 1114, 526], bRun2: [164, 594, 611, 668],
    bWorker: [164, 296, 373, 411], bResult: [50, 118, 1006, 168],
  };
  const FRAMES = [];   // the whole run, frames 0..185, squeezed into FAST_END seconds
  for (let i = 0; i < 60; i++) FRAMES.push(Math.round(i * 185 / 59));
  const fade = (t, a, b) => Math.min(Math.min(1, Math.max(0, (t - a) / .4)), b === undefined ? 1 : Math.min(1, Math.max(0, (b - t) / .4)));
  const $ = id => document.getElementById(id);

  function place(v, z) {   // z: slow push-in around the frame centre
    const k = v.k * z, cx = 960, cy = 540;
    const X = x => cx + ((x - v.x0) * v.k - cx) * z, Y = y => cy + ((y - v.y0) * v.k - cy) * z;
    $('shot').style.transform = `translate(${X(0)}px, ${Y(0)}px) scale(${k})`;
    for (const [id, [x1, y1, x2, y2]] of Object.entries(BOX)) {
      const e = $(id), p = 8;
      Object.assign(e.style, { left: `${X(x1) - p}px`, top: `${Y(y1) - p}px`, width: `${X(x2) - X(x1) + 2 * p}px`, height: `${Y(y2) - Y(y1) + 2 * p}px` });
    }
    const r = id => $(id).getBoundingClientRect();
    const L = (id, x, y) => Object.assign($(id).style, { left: `${x}px`, top: `${y}px` });
    L('lPlanner', r('bPlanner').left - r('lPlanner').width - 18, r('bPlanner').top + r('bPlanner').height / 2 - r('lPlanner').height / 2);
    L('lRun', r('bRun1').right - r('lRun').width, r('bRun1').bottom + 14);
    L('lWorker', r('bWorker').left, r('bWorker').top - r('lWorker').height - 12);
    L('lResult', r('bResult').right + 20, r('bResult').top + r('bResult').height / 2 - r('lResult').height / 2);
  }

  window.seek = t => {
    const f = t < FAST_END ? FRAMES[Math.min(59, Math.floor(t / FAST_END * 60))] : t < RESULT_AT ? 185 : 209;
    const img = $('shot');
    if (img.dataset.f !== String(f)) { img.src = `fr/f${String(f).padStart(5, '0')}.jpg`; img.dataset.f = f; }
    const graph = t < RESULT_AT;
    const z = graph && t >= FAST_END ? 1 + .035 * (t - FAST_END) / (RESULT_AT - FAST_END) : 1;
    place(graph ? VIEW.graph : VIEW.result, z);
    const g = graph && t >= FAST_END;
    ['bPlanner', 'lPlanner'].forEach(id => $(id).style.opacity = g ? fade(t, 2.1, 6.7) : 0);
    ['bRun1', 'bRun2', 'lRun'].forEach(id => $(id).style.opacity = g ? fade(t, 7.0, 14.3) : 0);
    ['bWorker', 'lWorker'].forEach(id => $(id).style.opacity = g ? fade(t, 14.6, 20.2) : 0);
    ['bResult', 'lResult'].forEach(id => $(id).style.opacity = graph ? 0 : fade(t, RESULT_AT + .3));
    $('speed').style.opacity = t < FAST_END + .3 ? 1 : Math.max(0, 1 - (t - FAST_END - .3) / .4);
    const cue = (window.SUBS || []).find(([a, b]) => t >= a && t < b);
    $('sub').style.display = cue ? 'block' : 'none';
    if (cue) $('sub').textContent = cue[2];
  };
</script>
</body>
</html>
