# Benchmark case: hidden ground truth for the evaluator. Agents never see this file
# (they get task.yaml instead).
id: kalmannet
paper:
  title: "KalmanNet: Neural Network Aided Kalman Filtering for Partially Known Dynamics"
  authors: "Revach, Shlezinger, Ni, Lopez Escoriza, van Sloun & Eldar"
  venue: "IEEE Transactions on Signal Processing 70 (2022)"
  arxiv: "2107.10043"   # numbers below are from arXiv v3 (11 Mar 2022), the TSP version
repo:
  url: https://github.com/KalmanNet/KalmanNet_TSP
  branch: main          # "batched" refactor of Feb 2023; implements architecture #2 (paper setting C4)
  commit: 828a2cf529bc84f43b37d543d916fe5858054457
  entrypoints:
    linear: main_linear_canonical.py   # Table I claims (needs T=20, nu=0 dB, 1/r2=20 dB instead of the defaults)
    lorenz_nlobs: main_lor_DT_NLobs.py # Table VI claims (defaults already match the 30 dB column)
  note: >
    Other branches exist: architecture-#1 (older, non-batched code for paper settings C1-C3)
    and architecture-#2 (older non-batched C4). The paper's linear experiments (Table I) used
    C1 = architecture #1; the main branch only has architecture #2.
difficulty: medium
expected_runtime_cpu_min: 8   # 6 runs (2 scripts x 3 seeds), 63-82 s each on an Apple M4 CPU

# Table I (2x2 linear, full information, trained on T = 20) and Table VI (Lorenz attractor,
# spherical observations, T = 20, nu = 0 dB). All values are test MSE in dB.
# A claim is reproduced when the mean over seeds is within tolerance:
#   abs: |mean - value| <= abs
# evidence_pattern matches the training trace only (2026-10-05): the value itself must also appear in the same
# log, which the evaluator checks separately. Patterns that also pinned the final print line failed a correct
# FITS run whose agent had (legitimately) patched the output format.
claims:
  - {id: knet_lin_T20,    metric: test_mse_db, setting: "Table I, Test T=20, KalmanNet (2x2, F canonical, H=I, nu=0 dB, 1/r2=20 dB inferred)", unit: dB, value: -21.92, tolerance: {abs: 0.3}, evidence_pattern: "MSE Training : tensor"}
  - {id: kf_lin_T20,      metric: test_mse_db, setting: "Table I, Test T=20, KF",                                                         unit: dB, value: -21.97, tolerance: {abs: 0.3}, evidence_pattern: "(?<!Extended )Kalman Filter - MSE LOSS: tensor\\([-0-9.]+\\) \\[dB\\]\\s*\\nKalman Filter - STD: tensor"}
  - {id: knet_nlobs_30dB, metric: test_mse_db, setting: "Table VI, KalmanNet, 1/r2=30 dB (Lorenz, h=spherical, T=20, nu=0 dB)",             unit: dB, value: -15.24, tolerance: {abs: 1.0}, evidence_pattern: "MSE Training : tensor", diagnostic_only: true}
  - {id: ekf_nlobs_30dB,  metric: test_mse_db, setting: "Table VI, EKF, 1/r2=30 dB",                                                       unit: dB, value: -4.02,  tolerance: {abs: 1.0}, diagnostic_only: true, evidence_pattern: "Extended Kalman Filter - MSE LOSS: tensor\\([-0-9.]+\\) \\[dB\\]\\s*\\nExtended Kalman Filter - STD: tensor"}

rubric:
  min_seeds: 3
  aggregate: mean
  levels:
    full: "all verdict claims within tolerance (diagnostic_only claims excluded)"
    partial: "at least one verdict claim within tolerance"
    fail: "no verdict claim reproduced or run did not finish"
  # Table I reproduces. The Table VI claims do not reproduce from the released code (see DISCREPANCY.md), so they
  # are diagnostic_only: measured and graded through the diagnosis, excluded from the verdict.
  expected_human_verdict: full
  metric_regex:
    knet: 'KalmanNet-MSE Test: tensor\((-?[0-9.]+)\) \[dB\]'
    kf:   '(?<!Extended )Kalman Filter - MSE LOSS: tensor\((-?[0-9.]+)\) \[dB\]'
    ekf:  'Extended Kalman Filter - MSE LOSS: tensor\((-?[0-9.]+)\) \[dB\]'
  tolerance_justification: >
    Linear (Table I): over 3 seeds (new data, init and batch order per seed) KalmanNet gives
    -21.887 +- 0.031 dB and the KF -21.988 +- 0.092 dB. The KF value is a Monte-Carlo estimate
    over 200 test sequences of length 20 (the analytic value for this setting is -21.968 dB),
    so its seed-to-seed spread (~0.1 dB) sets the scale; 0.3 dB is about 3 std of the noisier
    of the two. It still rejects the usual wrong setups: the repo defaults (nu=-20 dB,
    1/r2=0 dB) give a KF MSE near -7.2 dB, the wrong noise level shifts the result by whole
    dB, and an under-trained KalmanNet is far off (-13.2 dB after 50 steps, -17.0 dB after
    200 steps, versus -21.9 dB after the repo's 4000 steps).
    Lorenz (Table VI): per-seed std is 0.23 dB (KalmanNet) and 0.37 dB (EKF); the paper's own
    sigma-hat for comparable cells (Tables III, VII, VIII) is 0.1-0.8 dB. 1.0 dB is about 3 std.
    A faithful run of the official code misses both Table VI targets by 10.8 dB (KalmanNet)
    and 21.0 dB (EKF), so no reasonable tolerance makes them pass; they are kept as claims
    because an honest agent should report that they do not reproduce, rather than tune the
    setup until the numbers match.

# Known obstacles on a modern environment (Python 3.11, torch 2.14 CPU, numpy 2.4)
known_issues:
  - "All five main_*.py hard-code `args.use_cuda = True` and raise `Exception('No GPU found, please set args.use_cuda = False')` on CPU. Set it to False in the script; the --use_cuda CLI flag is overwritten by the script, and `type=bool` argparse flags turn any string, including 'False', into True."
  - "torch >= 2.6: `torch.load(path_results+'best-model.pt')` in Pipeline_EKF.NNTest fails because weights_only defaults to True and the file holds a pickled nn.Module. Pass weights_only=False."
  - "No seed is set anywhere (data generation, random.sample batching and weight init are all unseeded). Multi-seed runs need a patch (we read SEED in config.general_settings)."
  - "main_lor_DT_NLobs.py (Table VI) crashes twice on upstream main, independently of CUDA: (1) EKF: `TypeError: h_nonlinear() got an unexpected keyword argument 'jacobian'` (the batched getJacobian calls h(x, jacobian=True)); fix with an autograd Jacobian of toSpherical. (2) Training: `TypeError: unsqueeze() missing 1 required positional arguments: 'dim'` in the CompositionLoss branch of Pipeline_EKF.NNTrain; fix with torch.unsqueeze(..., 2)."
  - "Every run overwrites its dataset file in Simulations/<model>/data/ and KNet/best-model.pt, so concurrent runs clash. Run sequentially or give each run its own file names."
  - "Table I's noise level is never stated. It can be inferred: 2x2 controllable-canonical F, H=I (the code uses H=I for m=2 although the paper text says inverse canonical H), nu=0 dB, 1/r2=20 dB gives an analytic KF MSE of -21.968 dB at T=20 and -21.916 dB at T=200, matching the table's -21.97 / -21.91. The repo default for main_linear_canonical.py is a different setting (nu=-20 dB, 1/r2=0 dB, T=100; KF about -7.2 dB) that has no table entry."
  - "Paper/code mismatch: Table I used KalmanNet setting C1 (architecture #1, V3 training), but the main branch only implements architecture #2. Architecture #2 still reaches the KF within 0.04-0.16 dB here."
  - "Paper/code mismatch: the paper's loss is the state MSE (eqs. 10, 13), but main_lor_DT_NLobs.py trains with CompositionLoss=True, alpha=0.5 (half state MSE, half observation-space MSE) and in_mult=40, out_mult=5. Hyperparameters (steps, batch, lr, wd, dataset sizes) appear only in the code, not in the paper."
  - "Table VI does NOT reproduce with the official code: at 1/r2=30 dB, KalmanNet gives -26.0 dB (paper -15.24) and the EKF -25.0 dB (paper -4.02); at 10 dB, -5.9 / -4.8 dB (paper -1.77 / +14.50). KalmanNet still beats the EKF, but by about 1 dB, not the 11-16 dB the paper reports. Root cause (see `discrepancies:` below and DISCREPANCY.md): the paper's EKF row equals a zero-gain EKF (open-loop f(x0), e.g. Q_filter=0 with P0=0) within 1.5 dB at all five noise levels; the KalmanNet row matches neither the code nor the authors' own Dec-2021 checkpoints. Agents should report the gap, not tune it away."
  - "Training is Python-overhead bound (one small GRU step per time step). 1, 2 and 4 threads run at the same speed. Linear T=20: about 13 ms/step, so 4000 steps take 1-1.5 min; the repo-default T=100 needs 80-90 ms/step, about 6 min for 4000 steps."
  - "Table IX (main_lor_decimation.py, T=3000) is infeasible on CPU: about 3.5 s per training step, so 2000 steps take about 2 h. Training MSE was NaN from step 0 in a 2-step timing run. The EKF baseline itself is quick and close (-6.27 dB vs the paper's -6.432)."

# Root-cause ground truth for grading an agent's failure diagnosis (experiments: DISCREPANCY.md,
# results/discrepancy_ablation.csv, results/logs/discrepancy_*.log).
discrepancies:
  - claim_id: ekf_nlobs_30dB
    category: paper_error
    also_acceptable: [paper_code_mismatch]
    summary: "The paper's Table VI EKF row is not a working full-information EKF: it equals, within 1.5 dB at all five noise levels, an EKF with zero Kalman gain (Q_filter=0 or ~0 with P0=0, i.e. open-loop propagation of the known x0=(1,1,1) that ignores the measurements). The EKF the paper describes (true Q, R) gives -25 dB at 30 dB in the released code and -21.7 dB in the old code; the configuration behind the paper's row was never published."
    key_evidence:
      # Short, checkable facts (graded by keyword overlap); full numbers in DISCREPANCY.md
      - "EKF baseline needs no training yet is also about 20 dB off"
      - "zero Kalman gain (filter Q=0) reproduces the paper's EKF row"
      - "unknown or random initial state x0 gives a flat error at every noise level"
      - "released script cannot run its EKF; no Table VI script in any commit"
      - "old EKF uses the linear Jacobian (H=I) and diverges to NaN"
    confirmed_by: "results/discrepancy_ablation.csv, DISCREPANCY.md"
    confidence: confirmed
    # Strict attribution: category right AND at least one of these mechanisms named (case-insensitive phrases).
    decisive_evidence:
      - fact: "the paper's EKF row matches an EKF with zero Kalman gain (measurements ignored)"
        any_of: ["zero gain", "zero-gain", "zero kalman gain", "gain of zero", "kalman gain is zero", "open-loop", "open loop", "q=0", "q = 0", "ignores the measurements", "ignoring the measurements"]
  - claim_id: knet_nlobs_30dB
    category: paper_error
    also_acceptable: [paper_code_mismatch, unknown]
    summary: "The paper's KalmanNet value cannot be produced from the described setup: retraining (with the repo's composition loss or the paper's pure state MSE) gives -26.0 dB, and the authors' own Dec-2021 checkpoint for this exact setting gives -23.4 dB at 30 dB (but 25.3 vs the paper's 14.55 at -10 dB). The gap is not a constant shift, so the row likely comes from an unpublished run; the specific cause is unresolved. The paper's 11 dB KalmanNet-over-EKF margin is an artefact of the zero-gain EKF baseline (the real margin is about 1 dB)."
    key_evidence:
      # Short, checkable facts (graded by keyword overlap); full numbers in DISCREPANCY.md
      - "paper's EKF baseline is broken (zero gain), so the reported margin is unreliable"
      - "paper's pure state MSE loss gives the same result as the repo's composition loss"
      - "authors' own checkpoint also beats the paper's KalmanNet number"
      - "gap changes sign across noise levels, not a constant shift"
      - "authors' checkpoint only works with the fixed initial state x0"
    confirmed_by: "results/discrepancy_ablation.csv, DISCREPANCY.md"
    confidence: likely
    decisive_evidence:
      - fact: "the paper's KalmanNet margin is measured against a zero-gain EKF baseline"
        any_of: ["zero gain", "zero-gain", "zero kalman gain", "gain of zero", "kalman gain is zero", "open-loop", "open loop", "q=0", "q = 0", "ignores the measurements", "ignoring the measurements"]
      - fact: "the authors' own checkpoint also does far better than the paper's KalmanNet number"
        any_of: ["authors' checkpoint", "authors checkpoint", "authors' own checkpoint", "authors' saved", "released checkpoint", "pretrained checkpoint"]
