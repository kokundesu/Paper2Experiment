# Reference recipe (hidden; written by the benchmark builder).
id: itransformer
status: validated
repo: https://github.com/thuml/iTransformer
commit: c2426e68ca13f74aaec08045c5c724d8ad328124
files:
  patches/seed.py: '# run.py fixes its seed (fix_seed = <n>). Read it from P2E_SEED,
    defaulting to the script''s own value, so reference

    # runs can use other seeds; nothing else changes.

    import pathlib, re, sys

    p = pathlib.Path(sys.argv[1])

    s = p.read_text()

    m = re.search(r"fix_seed = (\d+)", s)

    assert m and s.count(m.group(0)) == 1

    s = s.replace(m.group(0), f''fix_seed = int(__import__("os").environ.get("P2E_SEED",
    "{m.group(1)}"))'')

    p.write_text(s)

    print("patched", p, "default seed", m.group(1))

    '
setup:
- git clone -q https://github.com/thuml/iTransformer repo && git -C repo checkout
  -q c2426e68ca13f74aaec08045c5c724d8ad328124
- uv venv -q --python 3.10 .venv
- uv pip install -q -p .venv -r repo/requirements.txt scipy==1.11.4 gdown==5.2.0
- .venv/bin/gdown -q 1l51QsKvQPcqILT3DwfjCgx8Dsg2rpjot -O datasets.zip && echo '01d7016eaa3eb571b77542612219d116dfc6a9f5399586dea1f98261fc4d80c4  datasets.zip'
  | shasum -a 256 -c
- unzip -q datasets.zip 'iTransformer_datasets/exchange_rate/exchange_rate.csv' &&
  mkdir -p repo/dataset/exchange_rate && cp iTransformer_datasets/exchange_rate/exchange_rate.csv
  repo/dataset/exchange_rate/
- .venv/bin/python patches/seed.py repo/run.py
command: cd repo && P2E_SEED={seed} ../.venv/bin/python -u run.py --is_training 1
