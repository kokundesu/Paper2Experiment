  -q d807e51fc2dcd143885ee639d97965a7ab0926f4
- uv venv -q --python 3.11 .venv
- uv pip install -q -p .venv numpy==1.26.4 pandas==2.3.3 scikit-learn==1.9.1 scipy==1.17.1
  matplotlib==3.11.2 torch==2.14.1 gdown==5.2.0
- .venv/bin/gdown -q 1bNbw1y8VYp-8pkRTqbjoW-TA-G8T0EQf -O datasets.zip && echo 'ef3382f5049b91690194530fa1431bf81728e1521a4976245db9dd102eb8fe61  datasets.zip'
