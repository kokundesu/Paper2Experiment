  - {id: citeseer_acc, metric: test_accuracy, setting: citeseer, unit: "%", description: "GCN test accuracy on Citeseer"}
  - {id: pubmed_acc,   metric: test_accuracy, setting: pubmed,   unit: "%", description: "GCN test accuracy on Pubmed"}
seeds: 3
