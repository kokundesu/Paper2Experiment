[project]
name = "p2e"
version = "0.1.0"
description = "Paper2Experiment: a LangGraph multi-agent system for reproducing engineering research papers"
requires-python = ">=3.11"
dependencies = [
    "openai>=3.24",
    "anthropic>=1.11",
    "langchain-core>=1.6",
    "langchain-anthropic>=1.7.6",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pypdf>=4.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
p2e = "p2e.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["p2e"]
